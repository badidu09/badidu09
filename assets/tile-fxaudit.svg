<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 350' role='img' aria-label='fxaudit: static analyzer for FiveM with 85 rules and no dependencies'><style>.a{animation:u 300ms cubic-bezier(.23,1,.32,1) backwards}@keyframes u{from{opacity:0;transform:translateY(8px)}}@media (prefers-reduced-motion:reduce){.a{animation:none}}</style><defs><clipPath id='c'><rect width='1200' height='350' rx='22'/></clipPath></defs><g clip-path='url(#c)'><rect width='1200' height='350' fill='#0E0E11'/><circle cx='1200' cy='0' r='260.4' fill='#FFB454' opacity='.09'/><g class='a' style='animation-delay:0ms'><text x='44' y='58' font-family='Cascadia Code,Consolas,Menlo,monospace' font-size='15' font-weight='600' fill='#FFB454' text-anchor='start'>// latest · open source static analyzer</text></g><g class='a' style='animation-delay:60ms'><text x='44' y='130' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='70' font-weight='800' fill='#F5F5F4' text-anchor='start'>fxaudit</text></g><g class='a' style='animation-delay:120ms'><text x='46' y='172' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='20' font-weight='400' fill='#A1A1AA' text-anchor='start'>finds what breaks, leaks or gets a fivem server</text><text x='46' y='200' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='20' font-weight='400' fill='#A1A1AA' text-anchor='start'>exploited, without ever running the code</text></g><g class='a' style='animation-delay:180ms'><text x='46' y='282' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='40' font-weight='800' fill='#FFB454' text-anchor='start'>85</text><text x='46' y='312' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='15' font-weight='400' fill='#A1A1AA' text-anchor='start'>rules</text><text x='136' y='282' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='40' font-weight='800' fill='#FFB454' text-anchor='start'>7,000+</text><text