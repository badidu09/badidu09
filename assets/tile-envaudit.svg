<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 410 300' role='img' aria-label='envaudit: zero-dependency CLI that keeps env files in sync'><style>.a{animation:u 300ms cubic-bezier(.23,1,.32,1) backwards}@keyframes u{from{opacity:0;transform:translateY(8px)}}@media (prefers-reduced-motion:reduce){.a{animation:none}}</style><defs><clipPath id='c'><rect width='410' height='300' rx='22'/></clipPath></defs><g clip-path='url(#c)'><rect width='410' height='300' fill='#0E0E11'/><circle cx='410' cy='0' r='254.2' fill='#D7FF3E' opacity='.09'/><g class='a' style='animation-delay:0ms'><text x='34' y='52' font-family='Cascadia Code,Consolas,Menlo,monospace' font-size='15' font-weight='600' fill='#D7FF3E' text-anchor='start'>// open source cli</text></g><g class='a' style='animation-delay:60ms'><text x='34' y='108' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='46' font-weight='800' fill='#F5F5F4' text-anchor='start'>envaudit</text></g><g class='a' style='animation-delay:120ms'><text x='34' y='144' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='18' font-weight='400' fill='#A1A1AA' text-anchor='start'>keeps code and .env files in sync,</text><text x='34' y='170' font-family='Segoe UI,-apple-system,Helvetica,Arial,sans-serif' font-size='18' font-weight='400' fill='#A1A1AA' text-anchor='start'>catches secrets before they leak</text></g><g class='a' style='animation-delay:180ms'><rect x='34' y='196' width='83' height='34' rx='17' fill='#D7FF3E' fill-opacity='.1' stroke='#D7FF3E' stroke-opacity='.35'/><text x='75.5' y='218' font-family='Cascadia Code,Consolas,Menlo,monospace' font-size='15' font-weight='600' fill='#D7FF3E' text-anchor='middle'>0 deps</text><rect x='127' y='196' width='55' height='34' rx='17' fill='#D7FF3E' fill-opacity='.1' stroke='#D7FF3E' stroke-opacity='.35'/><text x='154.5' y='218' font-family='Cascadia Code,Consolas,Menlo,monospace' font-size='15' font-weight='600' fill='#D7FF3E' text-anchor='middle'>MIT</text><rect x='192' y='196' width='110' height='34' rx='17' fill='#D7FF3E' fill-opacity='.1' stroke='#D7FF3E' stroke-opacity='.35'/><text x='247.0' y='218' font-family='Cascadia Code,Consolas,Menlo,monospace' font-size='15' font-weight='600' fill='#D7FF3E' text-anchor='middle'>CI action</text></g><g class='a' style='animation-delay:240ms'><text x='34' y='262' font-family='Cascadia Code,Consolas,Menlo,monospace' font-size='15' font-weight='400' fill='#D7FF3E' text-anchor='start'>$ npx github:badidu09/envaudit</text></g></g><rect x='.75' y='.75' width='408.5' height='298.5' rx='21.5' fill='none' stroke='#2A2A30' stroke-width='1.5'/></svg>